# Serves the static last-page variants.
# Paths under /variant* are served as-is; every other path is rewritten to a
# random variant0–9 prefix so / shows a different page on each request.
# Caching is disabled everywhere so the random variant is picked on every visit
# instead of a browser or CDN replaying a stored copy.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Hash the unique request id so each request picks a variant independently.
    split_clients "$request_id" $variant {
        10% "0";
        10% "1";
        10% "2";
        10% "3";
        10% "4";
        10% "5";
        10% "6";
        10% "7";
        10% "8";
        *   "9";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep redirects relative so mapped ports like 8080 stay in the URL.
        absolute_redirect off;

        # no-store stops anything from keeping a copy; the legacy Pragma and
        # Expires fields cover older clients. The CDN-* fields are read by
        # proxies such as Cloudflare, which would otherwise cache assets by
        # file extension regardless of Cache-Control. "always" keeps the
        # fields on error responses like 404 too.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;

        # Drop the validators nginx normally sends for static files, so no
        # client can revalidate its way into a 304 Not Modified.
        add_header Last-Modified "" always;
        etag off;
        if_modified_since off;

        # Direct links and assets already namespaced under a variant folder.
        # $uri/index.html avoids a slash redirect when /variantN is a directory.
        location /variant {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # Prefix a random variant so / and other non-variant paths pick a variant.
        location / {
            rewrite ^ /variant$variant$uri last;
        }
    }
}
